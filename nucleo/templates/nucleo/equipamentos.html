{% extends 'nucleo/base.html' %}
{% block conteudo %}
    
    <!-- formulario -->
    <div style="border: 1px solid #ccc; padding: 20px; background: #fff; margin-bottom: 20px; border-radius: 5px;">
        <h3 style="margin-top: 0;">Cadastrar EPI</h3>
        <form method="POST" action="/equipamentos/">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px;">Nome do Equipamento</label>
                <input type="text" name="nome" placeholder="Ex: Capacete de Segurança" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;">
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px;">Quantidade em Estoque</label>
                <input type="number" name="num_estoque" placeholder="Ex: 50" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background: #333; color: white; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;">Salvar Equipamento</button>
        </form>
    </div>

    <!-- tabela -->
    <div style="border: 1px solid #ccc; padding: 20px; background: #fff; border-radius: 5px;">
        <h3 style="margin-top: 0;">Lista de Equipamentos</h3>
        <form method="GET" action="/equipamentos/" style="margin-bottom: 15px; display: flex; gap: 10px;">
            <input type="text" name="busca" placeholder="Pesquisar por nome..." style="padding: 8px; flex-grow: 1; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="padding: 8px 15px; background: #efefef; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Buscar</button>
        </form>
        <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
            <tr style="background: #f1f1f1;">
                <th style="padding: 10px;">ID</th>
                <th style="padding: 10px;">Nome</th>
                <th style="padding: 10px;">Estoque</th>
            </tr>
            {% for epi in equipamentos %}
            <tr>
                <td style="padding: 10px;">{{ epi.id }}</td>
                <td style="padding: 10px;">{{ epi.nome }}</td>
                <td style="padding: 10px;">{{ epi.estoque }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" style="text-align: center; padding: 20px;">Nenhum equipamento registrado.</td></tr>
            {% endfor %}
        </table>
    </div>

{% endblock %}
