{% extends 'nucleo/base.html' %}
{% block conteudo %}
    
    <!-- formulario -->
    <div style="border: 1px solid #ccc; padding: 20px; background: #fff; margin-bottom: 20px; border-radius: 5px;">
        <h3 style="margin-top: 0;">Cadastrar Colaborador</h3>
        <form method="POST" action="/colaboradores/">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px;">Nome</label>
                <input type="text" name="nome" placeholder="Nome Completo" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;">
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px;">Matrícula</label>
                <input type="text" name="matricula" placeholder="Ex: 123456" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;">
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px;">Setor</label>
                <input type="text" name="setor" placeholder="Ex: Produção" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background: #333; color: white; cursor: pointer; border: none; border-radius: 4px; font-weight: bold;">Salvar Colaborador</button>
        </form>
    </div>

    <!-- tabela -->
    <div style="border: 1px solid #ccc; padding: 20px; background: #fff; border-radius: 5px;">
        <h3 style="margin-top: 0;">Lista de Colaboradores</h3>
        <form method="GET" action="/colaboradores/" style="margin-bottom: 15px; display: flex; gap: 10px;">
            <input type="text" name="busca" placeholder="Pesquisar..." style="padding: 8px; flex-grow: 1; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="padding: 8px 15px; background: #efefef; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Buscar</button>
        </form>
        <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
            <tr style="background: #f1f1f1;">
                <th style="padding: 10px;">Matrícula</th>
                <th style="padding: 10px;">Nome</th>
                <th style="padding: 10px;">Setor</th>
            </tr>
            {% for c in colaboradores %}
            <tr>
                <td style="padding: 10px;">{{ c.matricula }}</td>
                <td style="padding: 10px;">{{ c.nome }}</td>
                <td style="padding: 10px;">{{ c.setor }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" style="text-align: center; padding: 20px;">Nenhum colaborador encontrado.</td></tr>
            {% endfor %}
        </table>
    </div>

{% endblock %}
